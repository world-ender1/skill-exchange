spring:
  application:
    name: backend

  # Đọc file .env ở thư mục gốc dự án (chạy từ backend/ nên là ../.env).
  # Nhờ vậy Docker và Spring dùng chung một nguồn mật khẩu.
  # "optional:" = không có file thì vẫn chạy (khi deploy, biến lấy từ môi trường).
  config:
    import: optional:file:../.env[.properties]

  datasource:
    url: jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}

  jpa:
    hibernate:
      # Bảng do Flyway tạo (src/main/resources/db/migration). Hibernate chỉ kiểm tra khớp, không tự sửa DB.
      ddl-auto: validate
    open-in-view: false

  # Gửi thư xác thực (D11). Máy dev: Mailpit ở localhost:1025, không cần tài khoản.
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      # Máy chủ thư tắt hoặc chậm thì báo lỗi sau 5 giây, không treo request đăng ký (D27).
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000

app:
  # Địa chỉ frontend để tạo link xác thực ${FRONTEND_URL}/verify-email?token=... (D5).
  # Không có giá trị mặc định: thiếu thì ứng dụng dừng lúc khởi động.
  frontend-url: ${FRONTEND_URL}

  mail:
    from: no-reply@skillexchange.local

  # Đuôi email trường được phép đăng ký (D9, G6). So khớp chính xác phần sau dấu @;
  # tên miền con không tự được nhận. Đổi sang đuôi trường thật khi triển khai.
  allowed-email-domains:
    - student.example.edu.vn

  # Tài khoản admin đầu tiên, tạo lúc khởi động nếu chưa có (D4).
  # Thiếu hoặc sai thì ứng dụng dừng lúc khởi động (AdminInitializer báo lỗi, không in mật khẩu).
  # ":" ở cuối = giá trị mặc định rỗng, để AdminInitializer báo lỗi tiếng Việt rõ ràng
  # thay vì lỗi "Could not resolve placeholder" của Spring.
  admin:
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}

  jwt:
    # Khóa ký JWT HS256 (D14), ít nhất 32 byte. Cố ý KHÔNG có giá trị mặc định:
    # thiếu JWT_SECRET trong .env thì ứng dụng dừng ngay lúc khởi động.
    secret: ${JWT_SECRET}
