# Profile "test" (D39): chỉ đổi tên database sang skillexchange_test.
# Tài khoản và mật khẩu DB vẫn đọc từ ../.env như application.yml.
# Tạo DB một lần: docker compose exec db createdb -U skillexchange skillexchange_test
spring:
  datasource:
    url: jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/skillexchange_test

# Đuôi email trường dùng trong test (D9). Ghi rõ ở đây để test không phụ thuộc cấu hình chính.
app:
  allowed-email-domains:
    - student.example.edu.vn
