# Profile "test" (D39): đổi tên database sang skillexchange_test và ghi cố định vài giá trị test cần kiểm.
# Tài khoản và mật khẩu DB vẫn đọc từ ../.env như application.yml.
# Tạo DB một lần: docker compose exec db createdb -U skillexchange skillexchange_test
spring:
  datasource:
    url: jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/skillexchange_test

# Đuôi email trường dùng trong test (D9). Ghi rõ ở đây để test không phụ thuộc cấu hình chính.
app:
  allowed-email-domains:
    - student.example.edu.vn
  # Ghi rõ để test kiểm được link trong thư mà không phụ thuộc .env (TC03).
  frontend-url: http://localhost:5173
  # Admin đầu tiên (D4, TC81): cố ý viết hoa và có khoảng trắng để kiểm chuẩn hóa email.
  admin:
    email: " Admin@Student.Example.edu.vn "
    password: matkhau-admin-test
